services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                VITE_ADSENSE_CLIENT_ID: '${VITE_ADSENSE_CLIENT_ID:-}'
        image: gamely:latest
        restart: unless-stopped
        env_file:
            - .env
        volumes:
            - public:/var/www/html/public-shared
            - storage:/var/www/html/storage
        networks:
            - internal
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        command: >
            sh -c "cp -RT /var/www/html/public /var/www/html/public-shared &&
                   php-fpm"

    nginx:
        image: nginx:alpine
        container_name: gamely-nginx
        restart: unless-stopped
        volumes:
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
            - public:/var/www/html/public:ro
        networks:
            - internal
            - web
        depends_on:
            - app

    scheduler:
        image: gamely:latest
        restart: unless-stopped
        env_file:
            - .env
        volumes:
            - storage:/var/www/html/storage
        networks:
            - internal
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        command: ['php', 'artisan', 'schedule:work']

    queue:
        image: gamely:latest
        restart: unless-stopped
        env_file:
            - .env
        volumes:
            - storage:/var/www/html/storage
        networks:
            - internal
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        command: ['php', 'artisan', 'queue:work', '--tries=3', '--max-time=3600']

    mysql:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD}'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - mysql:/var/lib/mysql
        networks:
            - internal
        command:
            - --innodb-buffer-pool-size=512M
            - --max-connections=100
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${DB_ROOT_PASSWORD}']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    redis:
        image: redis:alpine
        restart: unless-stopped
        volumes:
            - redis:/data
        networks:
            - internal
        command: ['redis-server', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 5s
            retries: 5

networks:
    internal:
    web:
        external: true

volumes:
    mysql:
    redis:
    storage:
    public:
