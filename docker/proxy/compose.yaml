services:
    proxy:
        image: nginx:alpine
        container_name: proxy
        restart: unless-stopped
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - ./conf.d:/etc/nginx/conf.d:ro
            - ./nginx.conf:/etc/nginx/nginx.conf:ro
            - /etc/ssl/gamelygame:/etc/ssl/gamelygame:ro
        networks:
            - web

networks:
    web:
        name: web
